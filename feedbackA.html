<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>발음 피드백 · A 그룹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="assets/firebase-config.js"></script>
</head>
<body data-group="A" data-allowed="A">

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-logo">📊</div>
  <div class="login-title">발음 피드백<br>
    <span style="font-size:14px;font-weight:500;opacity:.65">Phản hồi phát âm — Nhóm A</span></div>
  <div class="login-sub">A 그룹</div>

  <div class="login-label">참여자 ID · Nhập mã của bạn (예: A01)</div>
  <div class="login-input-wrap">
    <input
      class="login-input"
      id="learnerInput"
      type="text"
      inputmode="latin"
      autocapitalize="characters"
      autocomplete="off"
      maxlength="3"
      placeholder="A01"
      oninput="onLearnerInput(this)"
      onkeypress="if(event.key==='Enter') doLogin()"
    >
    <div class="login-input-hint">A01~A20 · Mã A + 2 chữ số</div>
    <div class="login-input-error" id="loginError"></div>
  </div>
  <button class="login-start" id="loginStart" onclick="doLogin()">
    피드백 보기 · Xem phản hồi →
  </button>
</div>

<!-- 메인 앱 (로그인 후 표시) -->
<div id="appScreen" style="display:none">

  <header class="top-bar">
    <div class="top-left">
      <span id="lid-chip" class="lid-chip">-</span>
      <span id="group-chip" class="group-chip group-A">A 그룹</span>
      <span id="t-chip" class="t-chip">-</span>
    </div>
    <span id="top-prog" class="top-prog">- / -</span>
  </header>
  <div class="prog-wrap"><div id="prog-fill" class="prog-fill"></div></div>

  <div id="loading" class="loading">불러오는 중…</div>

  <main id="content" style="display:none">
    <div id="slides"></div>
    <div class="footer" style="padding: 20px 20px 80px">
      한국어 파열음 학습 — A 그룹<br>
      Học phát âm phụ âm tắc tiếng Hàn — Nhóm A
    </div>
  </main>

  <nav class="nav">
    <button id="btn-prev" class="nav-btn nav-prev" onclick="goPrev()">← 이전</button>
    <button id="btn-next" class="nav-btn nav-next" onclick="goNext()">다음 →</button>
  </nav>

</div>

<script src="assets/app.js"></script>
</body>
</html>
